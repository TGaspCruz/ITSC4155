<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      .chart-container {
        width: 90%;

        margin: 10px auto;
        background: #000000;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .chart-container canvas {
        width: 100% !important;
        height: 500px !important;
      }

      .portfolio-stats {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px;
        background: #606060;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      .stat-item {
        text-align: center;
      }

      .stat-item h1 {
        margin: 0;
        font-size: 2rem;
      }

      .stat-item h3 {
        margin: 5px 0 0 0;
      }

      .stat-item p {
        margin: 5px 0 0 0;
        color: #ffffff;
        font-size: 0.9rem;
      }

      .collapsible-header {
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 5px;
        margin-bottom: 10px;
        user-select: none;
      }

      .collapsible-header:hover {
        background: #e0e0e0;
      }

      .collapse-icon {
        transition: transform 0.3s ease;
      }

      .collapse-icon.collapsed {
        transform: rotate(-90deg);
      }

      .collapsible-content {
        max-height: 1000px;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .collapsible-content.collapsed {
        max-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>&#128200; Dashboard</h1>
      <nav>
        <a class="navLink" href="dashboard.html">Dashboard</a>
        <a class="navLink" href="tradeCenter.html">Trade Center</a>
        <a class="navLink" href="portfolio.html">Portfolio</a>
        <a class="navLink" href="advanceSearch.html">Advance Search</a>
        <a class="navLink" href="watchlist.html">Watchlist</a>
        <a class="navLink" href="transactionHistory.html">History</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </header>

    <div class="chart-container">
      <div class="portfolio-stats">
        <div class="stat-item">
          <h1 id="returnPercentage"></h1>
          <p>Investment Value</p>
        </div>
        <div class="stat-item">
          <h3 id="return"></h3>
          <p>Current Gain/Loss</p>
        </div>
      </div>
      <canvas id="myChart"></canvas>
    </div>

    <main></main>

    <script>
      let portfolioValue = 0;

      async function getStocks() {
        portfolioValue = 0;
        const res = await fetch("/api/getStocks");
        const data = await res.json();
        if (data.success) {
          data.stocks.forEach((stock) => {
            const marketValue = (stock.quantity * stock.avgPrice).toFixed(2);
            portfolioValue += parseFloat(marketValue);
          });
        }
      }

      window.addEventListener("load", () => {
        getStocks();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="dashboard.js"></script>
    <script>
      const data = {
        labels: [],
        datasets: [
          {
            label: "Holdings",
            data: [],
          },
        ],
      };

      const config = {
        type: "line",
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,

          interaction: {
            mode: "index",
            intersect: false,
          },

          plugins: {
            legend: {
              display: false,
            },
            tooltip: {
              backgroundColor: "rgba(0,0,0,0.8)",
              titleFont: { size: 14, weight: "bold" },
              bodyFont: { size: 13 },
              padding: 12,
              cornerRadius: 4,
              displayColors: false,
            },
          },

          elements: {
            line: {
              tension: 0.25,
              borderWidth: 5,
              borderColor: "#00c853",
            },
            point: {
              radius: 0,
              hoverRadius: 4,
              hoverBackgroundColor: "#ffffff",
              hoverBorderColor: "#00c853",
              hoverBorderWidth: 2,
            },
          },

          scales: {
            x: {
              grid: {
                display: false,
              },
              ticks: {
                color: "#888",
                maxTicksLimit: 6,
              },
            },
            y: {
              grid: {
                color: "rgba(200, 200, 200, 0.15)",
              },
              ticks: {
                color: "#888",
                callback: (value) => "$" + value,
              },
            },
          },
        },
      };

      function updateChart() {
        data.labels.push(new Date().toLocaleTimeString());
        data.datasets[0].data.push(portfolioValue);
        myChart.update();
      }

      const ctx = document.getElementById("myChart").getContext("2d");
      const myChart = new Chart(ctx, config);

      setInterval(updateChart, 1000);
      setInterval(getStocks, 1000);

      async function updatePercent() {
        portfolioValue = 0;
        const res = await fetch("/api/getStocks");
        const data = await res.json();
        if (data.success) {
          portfolioValue = 0;
          data.stocks.forEach((stock) => {
            const marketValue = stock.quantity * stock.avgPrice;
            portfolioValue += marketValue;
          });
        }

        const res2 = await fetch("/api/getFunds");
        const data2 = await res2.json();
        if (data2.success) {
          const totalMoney = data2.availableFunds + portfolioValue;
          const returns = totalMoney - 1000;

          document.getElementById("returnPercentage").textContent =
            "$" + portfolioValue.toFixed(2);

          const returnElement = document.getElementById("return");
          if (portfolioValue === 0) {
            returnElement.textContent =
              "$ +" + (data2.availableFunds - 1000).toFixed(2);
          } else if (returns > 0) {
            returnElement.textContent = "+ $" + returns.toFixed(2);
          } else if (returns === 0) {
            returnElement.textContent = "$" + returns.toFixed(2);
          } else {
            returnElement.textContent = "- $" + Math.abs(returns).toFixed(2);
          }
        } else {
          console.error("Failed to fetch funds:", data2.message);
        }
      }

      setInterval(updatePercent, 1000);
      document.getElementById('logoutBtn')?.addEventListener('click', async () => {
          try {
            const response = await fetch('/logout', { method: 'POST' });
            // ignore response and redirect to login (Testing Logout)
            const responseJson = await response.json();
            setTimeout(() => { window.location.href = responseJson.redirect; }, 300);
            } catch (err) {
                console.error('Logout failed', err);
                window.location.href = '/';
            }
          });
      
    </script>
    <script type="module" src="stockUpdates.mjs"></script>
  </body>
</html>
