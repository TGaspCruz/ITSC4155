<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header>
      <h1>&#128200; Stock Dashboard</h1>
      <nav>
        <a class="navLink" href="dashboard.html">Dashboard</a>
        <a class="navLink" href="tradeCenter.html">Trade Center</a>
        <a class="navLink" href="portfolio.html">Portfolio</a>
        <a class="navLink" href="advanceSearch.html">Advance Search</a>
        <a class="navLink" href="watchlist.html">Watchlist</a>
        <a class="navLink" href="transactionHistory.html">History</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </header>
    <div class="dashboard">
      <section class="left-column">
        <div class="tab">
          <button class="stock-tab active">Stock Gainers</button>
          <button class="stock-tab">Stock Losers</button>
          <button class="stock-tab">Most Active</button>
        </div>

        <div class="stock-table active">
          <div class="collapsible-header" onclick="toggleCollapse(0)">
            <h2>Top Stock Gainers</h2>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapsible-content">
            <table id="TopGainerTable" border="1"></table>
          </div>
        </div>

        <div class="stock-table">
          <div class="collapsible-header" onclick="toggleCollapse(1)">
            <h2>Top Stock Losers</h2>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapsible-content">
            <table id="TopLosersTable" border="1"></table>
          </div>
        </div>

        <div class="stock-table">
          <div class="collapsible-header" onclick="toggleCollapse(2)">
            <h2>Most Actively Traded</h2>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="collapsible-content">
            <table id="TopActivelyTraded" border="1"></table>
          </div>
        </div>
      </section>

      <section class="right-column">
        <h2>Trade Center</h2>
        <input
          type="text"
          id="ticker"
          placeholder="Enter stock ticker"
          maxlength="5"
        />
        <button id="searchBtn">Search</button>
        <div id="trade-form" class="form-popup" style="display: none">
          <p id="searchedTickerPrice"></p>
          <h3 id="form-title">Trade Stock</h3>
          <form id="trade-form" action="/api/buyStock" method="POST">
            <label for="quantity">Quantity:</label>
            <input
              type="number"
              id="quantity"
              name="quantity"
              min="1"
              step="1"
              required
            />
            <p id="available-funds-buy">Available funds:</p>
            <input type="hidden" id="hiddenTicker" name="ticker" />
            <input type="hidden" id="hiddenPrice" name="price" />
            <button id="buyBtn" type="submit" style="background-color: green">
              Buy
            </button>
            <p id="trade-message" style="margin-top: 0.5rem"></p>
          </form>
        </div>
      </section>
    </div>
  </body>
  <script>
    function toggleCollapse(index) {
      const tables = document.querySelectorAll(".stock-table");
      const content = tables[index].querySelector(".collapsible-content");
      const icon = tables[index].querySelector(".collapse-icon");

      content.classList.toggle("collapsed");
      icon.classList.toggle("collapsed");
    }
  </script>

  <script>
      let portfolioValue = 0;

      async function getStocks() {
        portfolioValue = 0;
        const res = await fetch("/api/getStocks");
        const data = await res.json();
        if (data.success) {
          data.stocks.forEach((stock) => {
            const marketValue = (stock.quantity * stock.avgPrice).toFixed(2);
            portfolioValue += parseFloat(marketValue);
          });
        }
      }

      window.addEventListener("load", () => {
        getStocks();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="dashboard.js"></script>
    <script>
      const data = {
        labels: [],
        datasets: [
          {
            label: "Holdings",
            data: [],
          },
        ],
      };

      const config = {
        type: "line",
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
        },
      };

      function updateChart() {
        data.labels.push(new Date().toLocaleTimeString());
        data.datasets[0].data.push(portfolioValue);
        myChart.update();
      }

      const ctx = document.getElementById("myChart").getContext("2d");
      const myChart = new Chart(ctx, config);

      setInterval(updateChart, 1000);
      setInterval(getStocks, 1000);

      async function updatePercent() {
        portfolioValue = 0;
        const res = await fetch("/api/getStocks");
        const data = await res.json();
        if (data.success) {
          portfolioValue = 0;
          data.stocks.forEach((stock) => {
            const marketValue = stock.quantity * stock.avgPrice;
            portfolioValue += marketValue;
          });
        }

        const res2 = await fetch("/api/getFunds");
        const data2 = await res2.json();
        if (data2.success) {
          const totalMoney = data2.availableFunds + portfolioValue;
          const returns = totalMoney - 1000;

          document.getElementById("returnPercentage").textContent =
            "$" + portfolioValue.toFixed(2);

          const returnElement = document.getElementById("return");
          if (portfolioValue === 0) {
            returnElement.textContent =
              "$ +" + (data2.availableFunds - 1000).toFixed(2);
          } else if (returns > 0) {
            returnElement.textContent = "+ $" + returns.toFixed(2);
          } else if (returns === 0) {
            returnElement.textContent = "$" + returns.toFixed(2);
          } else {
            returnElement.textContent = "- $" + Math.abs(returns).toFixed(2);
          }
        } else {
          console.error("Failed to fetch funds:", data2.message);
        }
      }

      setInterval(updatePercent, 1000);
    </script>
    <script type="module" src="stockUpdates.mjs"></script>
  </body>
</html>

</html>
